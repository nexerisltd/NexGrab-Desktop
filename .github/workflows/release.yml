name: Release

# Push a tag like v.2.1.0 (or v2.1.0 — the pattern below matches anything
# starting with "v") to trigger this. It:
#   1. Builds the Windows, macOS, and Linux installers in parallel, each on
#      its native runner (electron-builder can't cross-compile a working
#      NSIS/dmg/AppImage from a single OS, so this is the only reliable way
#      to get all three from one push).
#   2. Publishes all three as assets on a GitHub Release for that tag.
#   3. Rewrites the download links (and version number) in README.md and
#      commits that back to main automatically.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # electron-builder names/publishes the GitHub Release from
      # package.json's "version" field — NOT from the git tag that
      # triggered this run. Left alone, every tag (v2.1.0, v.0.0.1-test,
      # v.0.0.2-test, ...) keeps publishing to the same "v2.1.0" release
      # and overwriting its assets, since package.json's version never
      # changes between pushes. Strip the tag down to a bare semver and
      # write it into package.json first so the release electron-builder
      # creates actually matches the tag that was pushed.
      - name: Sync package.json version to the pushed tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#.}"
          echo "Tag $TAG -> version $VERSION"
          npm pkg set version="$VERSION"

      # electron-builder's own --publish flag creates the GitHub Release
      # (if it doesn't exist yet for this tag) and uploads that platform's
      # installer to it. Running this from 3 parallel jobs against the same
      # tag is safe — electron-builder appends assets to the existing
      # release rather than overwriting it. releaseType: "release" in
      # package.json's publish config (not the default "draft") means it
      # publishes immediately instead of leaving it for manual approval.
      - name: Build & publish (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the release electron-builder just published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder computes its own release tag from package.json's
          # "version" field — not necessarily the exact git tag that
          # triggered this run — so instead of assuming the two match
          # (they should, but this is more robust either way), just grab
          # whichever release was published most recently.
          gh api "repos/${{ github.repository }}/releases" --jq '.[0]' > /tmp/release.json
          node -e "
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync('/tmp/release.json', 'utf-8'));
            fs.writeFileSync('/tmp/assets.json', JSON.stringify(release.assets));
            fs.appendFileSync(process.env.GITHUB_ENV, 'TAG=' + release.tag_name + '\n');
          "

      - name: Update README.md download links
        run: node scripts/update-readme.js "$TAG" /tmp/assets.json

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date — nothing to commit"
          else
            git commit -m "docs: update download links for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
